{% load i18n %}

<div class="container">
    
    <!-- Card Strutturata Stile Quick Chiaro -->
    <div class="row justify-content-center">
        <div class="col-12 col-xl-10">
            <div class="card border-0 shadow-sm rounded-lg bg-white p-4 p-md-5">
                <div class="row align-items-stretch">
                    
                    <!-- Colonna Controlli (Sinistra) -->
                    <div class="col-md-6 border-right-md border-light pr-md-5 mb-4 mb-md-0 d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="h6 font-weight-bold text-uppercase tracking-wide text-dark mb-4">
                                {% trans "Create Astral Companion" %}
                            </h5>

                            <!-- NOME COMPAGNO -->
                            <div class="form-group mb-3 text-left">
                                <label class="form-control-label small font-weight-bold text-muted">
                                    {% trans "COMPANION NAME" %}
                                </label>
                                <input type="text" id="astral-name" class="form-control form-control-sm border-gray-300" value="Kyo" placeholder="{% trans 'Enter name...' %}">
                            </div>

                            <!-- 1. COLORE E VESTE -->
                            <div class="form-group mb-3 text-left">
                                <label class="form-control-label small font-weight-bold text-muted">
                                    1. {% trans "COLOR & VISUAL RAIMENT" %}
                                </label>
                                <select id="select-colore" class="custom-select custom-select-sm border-gray-300"></select>
                            </div>

                            <!-- 2. SPECIE -->
                            <div class="form-group mb-3 text-left">
                                <label class="form-control-label small font-weight-bold text-muted">
                                    2. {% trans "SPECIES" %}
                                </label>
                                <select id="select-specie" class="custom-select custom-select-sm border-gray-300"></select>
                            </div>

                            <!-- 3. PERSONALITÀ -->
                            <div class="form-group mb-4 text-left">
                                <label class="form-control-label small font-weight-bold text-muted">
                                    3. {% trans "PERSONALITY" %}
                                </label>
                                <select id="select-personalita" class="custom-select custom-select-sm border-gray-300"></select>
                            </div>
                        </div>

                        <!-- Unico Pulsante: Manifest an Astral -->
                        <div class="pt-2">
                            <button type="button" class="btn btn-primary btn-block font-weight-bold shadow-none" onclick="manifestAstral()">
                                {% trans "Manifest an Astral" %}
                            </button>
                        </div>
                    </div>

                    <!-- Colonna Risultato Codificato (Destra) -->
                    <div class="col-md-6 pl-md-5 d-flex flex-column justify-content-between text-left">
                        <div class="p-4 rounded bg-secondary border border-gray-300 h-100 d-flex flex-column justify-content-between shadow-xs">
                            <div>
                                <!-- Header Card -->
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge badge-soft-primary badge-pill text-xs text-uppercase font-weight-bold">
                                        {% trans "ASTRAL COMPANION" %}
                                    </span>
                                    <span id="display-specie-title" class="text-muted text-xs font-weight-bold">
                                        {% trans "Serpent" %}
                                    </span>
                                </div>

                                <h4 id="display-name" class="h5 text-dark font-weight-bold mt-2 mb-3">
                                    Kyo
                                </h4>

                                <!-- Spazio Centrale: Descrizione (Senza Titoletto) -->
                                <div class="mb-3">
                                    <p id="display-main-description" class="text-dark text-sm mb-0 lh-160"></p>
                                </div>
                            </div>

                            <!-- Parte Inferiore: Capacità Speciale Separata -->
                            <div>
                                <hr class="my-3 border-gray-300">
                                <div>
                                    <span class="text-muted text-xs font-weight-bold uppercase d-block mb-1">{% trans "SPECIAL ABILITY:" %}</span>
                                    <p id="display-capacita-desc" class="text-dark text-sm mb-0 lh-160"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
const i18nAstralLanding = "{% trans 'Your astral is landing...' %}";
const isAIEnabled = {% if section.attached_addon.enable_ai %}true{% else %}false{% endif %};

const TABELLA_COLORI = {
    1: { nome: "{% trans 'Celestial Air' %}", desc: "{% trans 'A light blue aura envelopes the creature and, upon taking flight, subtle harmless electric discharges intermittently burst into the air.' %}" },
    2: { nome: "{% trans 'Brown Rock' %}", desc: "{% trans 'Its body recalls the warm tones of the earth, and its stride produces a deep rumble scented with mineral dust.' %}" },
    3: { nome: "{% trans 'Soot Black' %}", desc: "{% trans 'Thin shadow scales and ash dust float along its back and coat, shrouding the creature in a persistent hazy cloud.' %}" },
    4: { nome: "{% trans 'Flame Red' %}", desc: "{% trans 'Vivid scarlet tones cover its body, while harmless sparks of hot air emerge from the fur on its head and back.' %}" },
    5: { nome: "{% trans 'Ice White' %}", desc: "{% trans 'A pristine white mantle covers the creature, emanating a persistent light frost and calling forth veils of mist as it moves.' %}" }
};

const TABELLA_SPECIE = {
    1: { specie: "{% trans 'Hawk' %}" },
    2: { specie: "{% trans 'Serpent' %}" },
    3: { specie: "{% trans 'Goat' %}" },
    4: { specie: "{% trans 'Leopard' %}" },
    5: { specie: "{% trans 'Bull' %}" }
};

const TABELLA_PERSONALITA = {
    1: { me: "{% trans 'Stubborn' %}", desc: "{% trans 'Never turns back from a target or planned route, refusing to change its mind until it gets what it wants.' %}" },
    2: { me: "{% trans 'Playful' %}", desc: "{% trans 'Loves to slither between legs, wrap around limbs, or hide small objects just for the fun of playing pranks.' %}" },
    3: { me: "{% trans 'Competitive' %}", desc: "{% trans 'Always seeks to surpass anyone in height, speed, or endurance, treating every obstacle as a personal challenge.' %}" },
    4: { me: "{% trans 'Affectionate' %}", desc: "{% trans 'Constantly seeks physical contact with the mage knight and allies, rubbing against them or protecting them with its presence.' %}" },
    5: { me: "{% trans 'Generous' %}", desc: "{% trans 'Always places its size and strength at the service of the party, taking on others difficulties without hesitation.' %}" }
};

const TABELLA_CAPACITA = {
    1: { nome: "{% trans 'Broad Feathered Wings' %}", desc: "{% trans 'A violent flap of wings creates a gust of wind that pushes up to two adjacent targets into a far zone.' %}" },
    2: { nome: "{% trans 'Tempered Scales' %}", desc: "{% trans 'Hardens its scales like diamond, halving all non-magical damage taken until the start of its next turn.' %}" },
    3: { nome: "{% trans 'Steel Claws' %}", desc: "{% trans 'Engages a target in combat or flight, applying the destabilized aspect for 1 turn without spending Hunt or Action Points.' %}" },
    4: { nome: "{% trans 'Bone Antlers' %}", desc: "{% trans 'Focuses magic through its branches to create a bubble of Astral energy around itself: all adjacent targets regain 1 HP.' %}" },
    5: { nome: "{% trans 'Crystalline Horn' %}", desc: "{% trans 'Focuses its frontal horn to project a bolt of astral energy that automatically strikes any target at its same altitude.' %}" }
};

function initAstralGenerator() {
    populateSelectOptions('select-colore', TABELLA_COLORI, item => `${item.key}. ${item.value.nome}`);
    populateSelectOptions('select-specie', TABELLA_SPECIE, item => `${item.key}. ${item.value.specie}`);
    populateSelectOptions('select-personalita', TABELLA_PERSONALITA, item => `${item.key}. ${item.value.me}`);
    
    document.getElementById('select-colore').value = 1; 
    document.getElementById('select-specie').value = 2;  
    document.getElementById('select-personalita').value = 2; 
    
    // Primo rendering statico all'avvio
    updateAstralCardStatic();

    const nameInput = document.getElementById('astral-name');
    if (nameInput) {
        nameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                manifestAstral();
            }
        });
    }
}

function populateSelectOptions(elementId, tableData, labelFormatter) {
    const select = document.getElementById(elementId);
    if (!select) return;
    select.innerHTML = '';
    Object.keys(tableData).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = labelFormatter({ key, value: tableData[key] });
        select.appendChild(option);
    });
}

// Rendering statico locale
function updateAstralCardStatic() {
    const nameInput = document.getElementById('astral-name');
    const name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : '{% trans "Astral Companion" %}';
    
    const coloreKey = document.getElementById('select-colore').value;
    const specieKey = document.getElementById('select-specie').value;
    const personalitaKey = document.getElementById('select-personalita').value;

    const coloreObj = TABELLA_COLORI[coloreKey];
    const specieObj = TABELLA_SPECIE[specieKey];
    const personalitaObj = TABELLA_PERSONALITA[personalitaKey];

    const randomCapacitaKey = Math.floor(Math.random() * 5) + 1;
    const capacitaObj = TABELLA_CAPACITA[randomCapacitaKey];

    document.getElementById('display-name').textContent = name;
    document.getElementById('display-specie-title').textContent = `${specieObj.specie}`;
    
    document.getElementById('display-main-description').innerText = `${coloreObj.nome}: ${coloreObj.desc} ${personalitaObj.me}: ${personalitaObj.desc}`;
    document.getElementById('display-capacita-desc').innerText = `${capacitaObj.nome}: ${capacitaObj.desc}`;
}

// Funzione unica invocata dal bottone "Manifest an Astral"
function manifestAstral() {
    if (!isAIEnabled) {
        updateAstralCardStatic();
        return;
    }

    const nameInput = document.getElementById('astral-name');
    const name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'Astral Companion';

    const coloreKey = document.getElementById('select-colore').value;
    const specieKey = document.getElementById('select-specie').value;
    const personalitaKey = document.getElementById('select-personalita').value;

    const coloreObj = TABELLA_COLORI[coloreKey];
    const specieObj = TABELLA_SPECIE[specieKey];
    const personalitaObj = TABELLA_PERSONALITA[personalitaKey];

    // Estrae la capacità speciale
    const randomCapacitaKey = Math.floor(Math.random() * 5) + 1;
    const capacitaObj = TABELLA_CAPACITA[randomCapacitaKey];

    // Aggiorna subito intestazione e capacità
    document.getElementById('display-name').textContent = name;
    document.getElementById('display-specie-title').textContent = `${specieObj.specie}`;
    document.getElementById('display-capacita-desc').innerText = `${capacitaObj.nome}: ${capacitaObj.desc}`;

    const mainDescElem = document.getElementById('display-main-description');
    
    // Animazione di caricamento
    mainDescElem.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-primary mr-2"></i>${i18nAstralLanding}`;

    const formData = new FormData();
    formData.append('name', name);
    formData.append('colore', `${coloreObj.nome} (${coloreObj.desc})`);
    formData.append('specie', specieObj.specie);
    formData.append('personalita', `${personalitaObj.me} (${personalitaObj.desc})`);
    formData.append('capacita', `${capacitaObj.nome} (${capacitaObj.desc})`);
    formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

    fetch("{% url 'geminigm:generate_astral_description_ajax' section.attached_addon.slug %}", {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success && data.description) {
            mainDescElem.innerText = data.description;
        } else {
            // Fallback statico
            mainDescElem.innerText = `${coloreObj.nome}: ${coloreObj.desc} ${personalitaObj.me}: ${personalitaObj.desc}`;
        }
    })
    .catch(error => {
        console.error("AI Astral Generation Error:", error);
        // Fallback statico su errore di rete
        mainDescElem.innerText = `${coloreObj.nome}: ${coloreObj.desc} ${personalitaObj.me}: ${personalitaObj.desc}`;
    });
}

document.addEventListener("DOMContentLoaded", function() {
    initAstralGenerator();
});
</script>
